name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall app tests

      - name: Run tests
        run: pytest -q

      - name: Validate Dockerfile
        run: docker build -t privorai-ci .

      - name: Validate Compose base config
        run: docker compose -f docker-compose.yml config

      - name: Validate Compose production config
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml config
